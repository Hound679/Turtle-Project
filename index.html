<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turtle Online</title>

<style>
body{
  margin:0;
  display:grid;
  place-items:center;
  height:100vh;
  background:#111;
  font-family:Arial, sans-serif;
}
canvas{
  background:#fff;
  border:2px solid #000;
}

/* HUD */
#hud{
  position:fixed;
  top:10px;
  left:10px;
  background:rgba(0,0,0,.75);
  color:#fff;
  padding:10px 12px;
  border-radius:10px;
  min-width:260px;
  font-size:14px;
}
#hud code{ color:#7CFC00; }

/* Title */
#gameTitle{
  position:fixed;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  font-size:26px;
  font-weight:800;
  text-shadow:0 2px 10px rgba(0,0,0,.6);
}

/* Menu */
#menuOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:grid;
  place-items:center;
  z-index:999;
}
#menuBox{
  width:420px;
  padding:24px;
  border-radius:16px;
  background:#222;
  color:white;
  text-align:center;
}
.btn{
  padding:14px;
  margin:8px 0;
  border-radius:12px;
  border:none;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.btnGreen{ background:#7CFC00; }
.hidden{ display:none; }
</style>
</head>

<body>

<div id="gameTitle">Triangle Sword Game</div>

<div id="hud">
Mode: <span id="mode">MENU</span><br>
Status: <span id="status">-</span><br>
Your id: <code id="myid">-</code><br>
Score: <span id="score">0</span><br>
<span>WASD to move · ESC menu</span>
</div>

<div id="menuOverlay">
  <div id="menuBox">
    <h1>Triangle</h1>
    <button class="btn" id="btnSingle">Single Player</button>
    <button class="btn btnGreen" id="btnMulti">Multiplayer</button>
  </div>
</div>

<canvas id="game" width="800" height="500"></canvas>

<script>
/* =====================
   BASIC SETUP
===================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WS_URL = "wss://turtle-ws-server.onrender.com";

/* HUD */
const modeEl = document.getElementById("mode");
const statusEl = document.getElementById("status");
const myIdEl = document.getElementById("myid");
const scoreEl = document.getElementById("score");

/* MENU */
const menu = document.getElementById("menuOverlay");
document.getElementById("btnSingle").onclick = startSingle;
document.getElementById("btnMulti").onclick = startMulti;

/* STATE */
let mode = "MENU";
let ws = null;
let score = 0;

/* PLAYER */
const me = {
  id:null,
  x:400,
  y:250,
  angle:0,
  speed:3,
  turn:0.08
};

/* INPUT */
const keys = {w:false,a:false,s:false,d:false};
window.onkeydown = e=>{
  if(e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true;
  if(e.key==="Escape") openMenu();
};
window.onkeyup = e=>{
  if(e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false;
};

/* ENEMIES */
const enemies = [];
const ENEMY_RADIUS = 12;
const ENEMY_SPEED = 1.6;
const SPAWN_DELAY = 900;
let spawnTimer = 0;

/* SWORD */
const SWORD_LENGTH = 34;
const SWORD_WIDTH = 8;
const SWORD_OFFSET = 16;

/* =====================
   MENU FUNCTIONS
===================== */
function openMenu(){
  if(ws) ws.close();
  ws=null;
  mode="MENU";
  score=0;
  enemies.length=0;
  menu.classList.remove("hidden");
  modeEl.textContent="MENU";
  statusEl.textContent="-";
  myIdEl.textContent="-";
  scoreEl.textContent=0;
}

function startSingle(){
  openMenu();
  mode="SINGLE";
  me.id="local";
  menu.classList.add("hidden");
  modeEl.textContent="SINGLE";
  statusEl.textContent="offline";
  myIdEl.textContent="local";
}

function startMulti(){
  openMenu();
  mode="MULTI";
  menu.classList.add("hidden");
  modeEl.textContent="MULTI";
  statusEl.textContent="connecting...";
  ws = new WebSocket(WS_URL);

  ws.onopen=()=>statusEl.textContent="connected";
  ws.onclose=()=>statusEl.textContent="disconnected";
}

/* =====================
   GAME LOGIC
===================== */
function spawnEnemy(){
  const edge = Math.floor(Math.random()*4);
  let x,y;
  if(edge===0){ x=Math.random()*canvas.width; y=-20; }
  if(edge===1){ x=canvas.width+20; y=Math.random()*canvas.height; }
  if(edge===2){ x=Math.random()*canvas.width; y=canvas.height+20; }
  if(edge===3){ x=-20; y=Math.random()*canvas.height; }
  enemies.push({x,y});
}

function update(dt){
  if(mode==="MENU") return;

  if(keys.a) me.angle -= me.turn;
  if(keys.d) me.angle += me.turn;
  if(keys.w){ me.x+=Math.cos(me.angle)*me.speed; me.y+=Math.sin(me.angle)*me.speed; }
  if(keys.s){ me.x-=Math.cos(me.angle)*me.speed; me.y-=Math.sin(me.angle)*me.speed; }

  spawnTimer+=dt;
  if(spawnTimer>SPAWN_DELAY){
    spawnEnemy();
    spawnTimer=0;
  }

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const dx=me.x-e.x, dy=me.y-e.y;
    const d=Math.hypot(dx,dy)||1;
    e.x+=dx/d*ENEMY_SPEED;
    e.y+=dy/d*ENEMY_SPEED;

    const sx=me.x+Math.cos(me.angle)*SWORD_OFFSET;
    const sy=me.y+Math.sin(me.angle)*SWORD_OFFSET;
    const ex=sx+Math.cos(me.angle)*SWORD_LENGTH;
    const ey=sy+Math.sin(me.angle)*SWORD_LENGTH;

    const dist = pointSeg(e.x,e.y,sx,sy,ex,ey);
    if(dist < ENEMY_RADIUS+SWORD_WIDTH){
      enemies.splice(i,1);
      score++;
      scoreEl.textContent=score;
    }
  }
}

/* =====================
   DRAWING
===================== */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // player
  ctx.save();
  ctx.translate(me.x,me.y);
  ctx.rotate(me.angle);
  ctx.beginPath();
  ctx.moveTo(18,0);
  ctx.lineTo(-14,10);
  ctx.lineTo(-14,-10);
  ctx.closePath();
  ctx.fillStyle="green";
  ctx.fill();
  ctx.restore();

  // sword
  const sx=me.x+Math.cos(me.angle)*SWORD_OFFSET;
  const sy=me.y+Math.sin(me.angle)*SWORD_OFFSET;
  const ex=sx+Math.cos(me.angle)*SWORD_LENGTH;
  const ey=sy+Math.sin(me.angle)*SWORD_LENGTH;
  ctx.lineWidth=SWORD_WIDTH;
  ctx.strokeStyle="#777";
  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.lineTo(ex,ey);
  ctx.stroke();

  // enemies
  for(const e of enemies){
    ctx.beginPath();
    ctx.arc(e.x,e.y,ENEMY_RADIUS,0,Math.PI*2);
    ctx.fillStyle="red";
    ctx.fill();
  }
}

/* =====================
   HELPERS
===================== */
function pointSeg(px,py,ax,ay,bx,by){
  const abx=bx-ax, aby=by-ay;
  const apx=px-ax, apy=py-ay;
  let t=(apx*abx+apy*aby)/(abx*abx+aby*aby);
  t=Math.max(0,Math.min(1,t));
  const cx=ax+abx*t, cy=ay+aby*t;
  return Math.hypot(px-cx,py-cy);
}

/* =====================
   LOOP
===================== */
let last=performance.now();
function loop(t){
  const dt=t-last; last=t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
loop(performance.now());
</script>
</body>
</html>
