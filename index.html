<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turtle Online (Sword + Enemies + OUT + Score)</title>
  <style>
    body { margin: 0; display: grid; place-items: center; height: 100vh; background: #111; font-family: Arial, sans-serif; }
    canvas { background: #fff; border: 2px solid #000; }

    #gameTitle{
      position: fixed; top: 14px; left: 50%;
      transform: translateX(-50%);
      color: white; font-size: 26px; font-weight: 800;
      text-shadow: 0 2px 10px rgba(0,0,0,.6);
      user-select: none;
    }

    #hud{
      position: fixed; top: 10px; left: 10px;
      background: rgba(0,0,0,.75); color: #fff; padding: 10px 12px;
      font: 14px Arial; border-radius: 10px;
      min-width: 320px;
    }
    #hud code{ color: #7CFC00; }

    #chat{
      position: fixed; bottom: 10px; left: 50%;
      transform: translateX(-50%);
      width: min(520px, 92vw);
      background: rgba(0,0,0,.75);
      border-radius: 12px;
      padding: 8px;
      color: white;
      font-size: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
    }
    #messages{ max-height: 140px; overflow-y: auto; margin-bottom: 6px; padding-right: 4px; }
    #messages div{ margin-bottom: 4px; }
    #chatInput{
      width: 100%; box-sizing: border-box;
      border-radius: 8px; border: none;
      padding: 8px 10px; outline: none;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="gameTitle">Multiplayer</div>

  <div id="hud">
    Status: <span id="status">connecting...</span><br/>
    Your id: <code id="myid">-</code><br/>
    Room: <span id="room">-</span><br/>
    Players online: <span id="count">0</span><br/>
    Your score: <code id="myscore">0</code><br/>
    Server: <code id="wsurl"></code><br/>
    <span style="opacity:.85;">WASD move. Sword kills enemies. Chat: type + Enter.</span>
  </div>

  <canvas id="game" width="800" height="500"></canvas>

  <div id="chat">
    <div id="messages"></div>
    <input id="chatInput" placeholder="Type message and press Enter..." />
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const WS_URL = "wss://turtle-ws-server.onrender.com";
    document.getElementById("wsurl").textContent = WS_URL;

    const statusEl = document.getElementById("status");
    const myIdEl = document.getElementById("myid");
    const roomEl = document.getElementById("room");
    const countEl = document.getElementById("count");
    const myScoreEl = document.getElementById("myscore");

    const chatInput = document.getElementById("chatInput");
    const messagesDiv = document.getElementById("messages");

    // Persisted token (score saved per browser)
    const TOKEN_KEY = "turtle_token_v1";
    function getToken() {
      let t = localStorage.getItem(TOKEN_KEY);
      if (!t) {
        t = "t_" + Math.random().toString(16).slice(2) + Date.now().toString(16);
        localStorage.setItem(TOKEN_KEY, t);
      }
      return t;
    }
    const myToken = getToken();

    const players = {};
    let hazards = [];

    const keys = { w:false, a:false, s:false, d:false };
    function clearKeys(){ for (const k in keys) keys[k] = false; }

    chatInput.addEventListener("focus", clearKeys);
    chatInput.addEventListener("blur", clearKeys);
    window.addEventListener("blur", clearKeys);
    document.addEventListener("visibilitychange", () => { if (document.hidden) clearKeys(); });

    function isTyping(){ return document.activeElement === chatInput; }

    window.addEventListener("keydown", (e) => {
      if (isTyping()) return;
      const k = e.key.toLowerCase();
      if (k in keys) { keys[k] = true; e.preventDefault(); }
    });
    window.addEventListener("keyup", (e) => {
      if (isTyping()) return;
      const k = e.key.toLowerCase();
      if (k in keys) { keys[k] = false; e.preventDefault(); }
    });

    const me = {
      id: null,
      x: canvas.width/2,
      y: canvas.height/2,
      angle: 0,
      speed: 3,
      turnSpeed: 0.08
    };

    let ws = null;
    let reconnectTimer = null;

    function addMsg(text){
      const div = document.createElement("div");
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function connectWS() {
      if (reconnectTimer) clearTimeout(reconnectTimer);

      statusEl.textContent = "connecting...";
      ws = new WebSocket(WS_URL);

      ws.addEventListener("open", () => {
        statusEl.textContent = "connected";
        // send token to load score
        ws.send(JSON.stringify({ type: "hello", token: myToken }));
      });

      ws.addEventListener("close", (ev) => {
        statusEl.textContent = "disconnected (reconnecting...)";
        if (ev.code === 4001) addMsg("ServerBot: You were kicked (3 warnings). Refresh to rejoin.");
        reconnectTimer = setTimeout(connectWS, 1200);
      });

      ws.addEventListener("message", (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }

        if (msg.type === "welcome") {
          me.id = msg.id;
          myIdEl.textContent = me.id;
          roomEl.textContent = msg.room ?? "-";
        }

        if (msg.type === "score") {
          myScoreEl.textContent = String(msg.score ?? 0);
        }

        if (msg.type === "state") {
          for (const p of msg.players) players[p.id] = p;
          for (const id in players) {
            if (!msg.players.find(p => p.id === id)) delete players[id];
          }
          hazards = msg.hazards || [];
          countEl.textContent = msg.players.length;

          // update my score from state too
          if (me.id && players[me.id]) myScoreEl.textContent = String(players[me.id].score ?? 0);
        }

        if (msg.type === "chat") {
          addMsg(msg.from + ": " + msg.text);
        }
      });
    }

    connectWS();

    // chat send
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && chatInput.value.trim() !== "") {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "chat", text: chatInput.value.trim() }));
        }
        chatInput.value = "";
        chatInput.blur();
      }
    });

    function amIOut() {
      const p = players[me.id];
      return p ? (p.outUntil || 0) > Date.now() : false;
    }
    function outSecondsLeft() {
      const p = players[me.id];
      return p ? Math.max(0, Math.ceil(((p.outUntil || 0) - Date.now())/1000)) : 0;
    }

    function update() {
      if (amIOut()) { clearKeys(); return; }

      if (keys.a) me.angle -= me.turnSpeed;
      if (keys.d) me.angle += me.turnSpeed;

      if (keys.w) { me.x += Math.cos(me.angle)*me.speed; me.y += Math.sin(me.angle)*me.speed; }
      if (keys.s) { me.x -= Math.cos(me.angle)*me.speed; me.y -= Math.sin(me.angle)*me.speed; }

      me.x = Math.max(0, Math.min(canvas.width, me.x));
      me.y = Math.max(0, Math.min(canvas.height, me.y));

      if (ws && ws.readyState === WebSocket.OPEN && me.id) {
        ws.send(JSON.stringify({ type: "move", x: me.x, y: me.y, angle: me.angle }));
      }
    }

    function drawPlayer(p) {
      const size = 18;
      const isOut = (p.outUntil || 0) > Date.now();

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);

      // body triangle
      ctx.beginPath();
      ctx.moveTo(size, 0);
      ctx.lineTo(-size * 0.8, size * 0.6);
      ctx.lineTo(-size * 0.8, -size * 0.6);
      ctx.closePath();
      ctx.globalAlpha = isOut ? 0.25 : 1.0;
      ctx.fillStyle = p.color || "green";
      ctx.fill();

      // sword triangle (front)
      ctx.beginPath();
      ctx.moveTo(size + 18, 0);
      ctx.lineTo(size + 2, 5);
      ctx.lineTo(size + 2, -5);
      ctx.closePath();
      ctx.fillStyle = "gray";
      ctx.fill();

      ctx.restore();

      // name + score
      ctx.globalAlpha = 1;
      ctx.font = "bold 16px Arial";
      ctx.textAlign = "center";
      ctx.fillStyle = "black";
      ctx.fillText(`${p.label || "Player"} (${p.score ?? 0})`, p.x, p.y - 25);

      if (isOut) {
        const left = Math.max(0, Math.ceil(((p.outUntil || 0) - Date.now()) / 1000));
        ctx.font = "bold 14px Arial";
        ctx.fillStyle = "red";
        ctx.fillText(`OUT ${left}s`, p.x, p.y - 7);
      }
    }

    function drawHazard(h) {
      const angle = Math.atan2(h.vy, h.vx);
      const s = h.size || 10;

      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(angle);

      ctx.beginPath();
      ctx.moveTo(s, 0);
      ctx.lineTo(-s * 0.9, s * 0.6);
      ctx.lineTo(-s * 0.9, -s * 0.6);
      ctx.closePath();
      ctx.fillStyle = "black";
      ctx.fill();

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const h of hazards) drawHazard(h);
      for (const id in players) drawPlayer(players[id]);

      if (amIOut()) {
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "center";
        ctx.fillStyle = "red";
        ctx.fillText(`YOU ARE OUT: ${outSecondsLeft()}s`, canvas.width/2, 60);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
