<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turtle en HTML (Canvas)</title>
  <style>
    body { margin: 0; display: grid; place-items: center; height: 100vh; background: #111; }
    canvas { background: #fff; border: 2px solid #000; }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="500"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // "Jugador"
    const player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      angle: 0,        // en radianes
      speed: 3,
      turnSpeed: 0.08, // giro
      size: 18
    };

    // Teclas WASD (mantener presionado)
    const keys = { w:false, a:false, s:false, d:false };

    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = true;
    });

    window.addEventListener("keyup", (e) => {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = false;
    });

    function update() {
      // Rotación
      if (keys.a) player.angle -= player.turnSpeed;
      if (keys.d) player.angle += player.turnSpeed;

      // Movimiento adelante/atrás (tipo turtle)
      if (keys.w) {
        player.x += Math.cos(player.angle) * player.speed;
        player.y += Math.sin(player.angle) * player.speed;
      }
      if (keys.s) {
        player.x -= Math.cos(player.angle) * player.speed;
        player.y -= Math.sin(player.angle) * player.speed;
      }

      // (Opcional) límites de pantalla
      player.x = Math.max(0, Math.min(canvas.width, player.x));
      player.y = Math.max(0, Math.min(canvas.height, player.y));
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dibujar "tortuga" como un triángulo apuntando hacia angle
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);

      ctx.beginPath();
      ctx.moveTo(player.size, 0);
      ctx.lineTo(-player.size * 0.8, player.size * 0.6);
      ctx.lineTo(-player.size * 0.8, -player.size * 0.6);
      ctx.closePath();
      ctx.fillStyle = "green";
      ctx.fill();

      ctx.restore();

      // Texto "Player" encima (NO parpadea)
      ctx.font = "bold 16px Arial";
      ctx.textAlign = "center";
      ctx.fillStyle = "black";
      ctx.fillText("Player", player.x, player.y - 25);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
